[project]
name = "rusty-baregain-mvp"
version = "0.1.0"
description = "Demo analítica reproducible de referencia histórica de precios de vehículos usados"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.0",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
]

[dependency-groups]
analysis = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "seaborn>=0.13",
]

[tool.uv]
package = false
